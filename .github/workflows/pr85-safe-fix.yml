name: PR85 Safe Dependency Fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pr85-safe-fix.yml'

permissions:
  contents: write

jobs:
  safe-fix:
    if: github.event.pull_request.head.ref == 'stabilization/pr85-dependency-audit'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply non-breaking audit fixes to lockfile
        run: npm audit fix --package-lock-only || true

      - name: Install resolved dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Audit after safe fixes
        run: npm audit || true

      - name: Commit lockfile changes
        run: |
          if git diff --quiet package-lock.json; then
            echo "No package-lock changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: apply non-breaking dependency security fixes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
