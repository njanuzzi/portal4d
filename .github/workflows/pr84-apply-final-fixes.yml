name: PR84 Apply Final Focused Fixes

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/pr84-final-type-fixes.mjs'

permissions:
  contents: write

jobs:
  apply-fixes:
    if: github.event.pull_request.head.ref == 'stabilization/pr84-typecheck-debt'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply exact type fixes
        run: node scripts/pr84-final-type-fixes.mjs

      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/client/DiaryPage.tsx src/pages/therapist/ClientDetail.tsx src/pages/therapist/Clients.tsx src/pages/therapist/DiaryDetail.tsx
          git commit -m "fix: resolve remaining PR84 type boundaries"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
