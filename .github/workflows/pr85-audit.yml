name: PR85 Dependency Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit and summarize
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          const metadata = audit.metadata?.vulnerabilities ?? {};
          console.log('AUDIT_TOTALS', JSON.stringify(metadata));
          const rows = Object.entries(audit.vulnerabilities ?? {}).map(([name, v]) => ({
            name,
            severity: v.severity,
            direct: Boolean(v.isDirect),
            range: v.range,
            effects: v.effects ?? [],
            fixAvailable: v.fixAvailable,
            via: (v.via ?? []).map(x => typeof x === 'string' ? x : `${x.name}:${x.title}`).slice(0, 8),
          }));
          const rank = { critical: 4, high: 3, moderate: 2, low: 1, info: 0 };
          rows.sort((a,b) => (rank[b.severity] ?? 0) - (rank[a.severity] ?? 0) || Number(b.direct) - Number(a.direct) || a.name.localeCompare(b.name));
          for (const row of rows) console.log('AUDIT_ITEM', JSON.stringify(row));
          NODE
